name: Generate Bomberman

on:
  schedule: # Execute every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual triggering
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generates a bomberman arcade game from a github user's contributions graph
      - name: Generate bomberman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          github_user_name: HinnoNguyen
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: 'bomberman'
          
      # Push the content of <build_dir> to a branch
      # The content will be available at https://raw.githubusercontent.com/<username>/<repo>/<target_branch>/<file>
      - name: Push bomberman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
